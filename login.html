<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PEHELWAAN</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1 class="logo">PEHELWAAN</h1>
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to continue your journey</p>
      <form>
        <div class="input-group">
          <label for="email">Username</label>
          <input type="input" id="email" placeholder="Enter your username" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn" id="butt">Login</button>
      </form>
      
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
